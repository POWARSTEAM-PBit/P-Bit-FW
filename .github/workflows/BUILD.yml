name: Build and Release Firmware
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write  # Required for creating releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.1.19
      
      - name: Build project
        run: |
          platformio run -e esp32dev
      
      - name: Collect firmware artifacts
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="firmware-artifacts"
          BUILD_DIR=".pio/build/esp32dev"
          mkdir -p "$ARTIFACT_DIR"
          cp "$BUILD_DIR/firmware.bin" "$ARTIFACT_DIR/"
          cp "$BUILD_DIR/firmware.elf" "$ARTIFACT_DIR/"
          cp "$BUILD_DIR/firmware.map" "$ARTIFACT_DIR/"
          cp "$BUILD_DIR/bootloader.bin" "$ARTIFACT_DIR/"
          cp "$BUILD_DIR/partitions.bin" "$ARTIFACT_DIR/"
          cp "$BUILD_DIR/idedata.json" "$ARTIFACT_DIR/"
          cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" "$ARTIFACT_DIR/"
          (cd "$ARTIFACT_DIR" && sha256sum * > SHA256SUMS.txt)
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32dev
          path: firmware-artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32dev
          path: firmware-artifacts
      
      - name: Generate release tag
        id: tag
        run: |
          TAG="build-$(date +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: firmware-artifacts/*
          name: Firmware Build ${{ steps.tag.outputs.tag }}
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
