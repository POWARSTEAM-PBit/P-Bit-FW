[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    h2zero/NimBLE-Arduino@1.4.3
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.15
    milesburton/DallasTemperature@4.0.5
    maffooclock/ESP32RotaryEncoder@1.2.0
    paulstoffregen/OneWire@2.3.8

build_flags =
    -include lib/TFT_eSPI/User_Setup.h
    -DUSER_SETUP_LOADED
    -Os
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=1

; ---------------------------------------------------------------------------
; Environment de depuración — NO usar para builds de producción.
; Activa FIRMWARE_DEBUG vía build flag (NO descomentar en include/config.h).
; Habilita reportes periódicos de Stack HWM por Serial monitor.
; Procedimiento: ver docs/TECHNICAL.md § Apéndice A y docs/HARDWARE_VALIDATION_2026-06-04.md.
; Build:   py -m platformio run -e esp32dev_debug
; Upload:  py -m platformio run -e esp32dev_debug -t upload
; Monitor: py -m platformio device monitor --baud 115200
; ---------------------------------------------------------------------------
[env:esp32dev_debug]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DFIRMWARE_DEBUG
